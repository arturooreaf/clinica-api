openapi: 3.0.3

info:
  title: Clinica API
  version: 1.0.0
  description: |
    API for managing the patients and appointments of a physiotherapy clinic's agenda.

    Authentication uses JWT (Bearer). The token is obtained from `POST /auth/login`
    and expires after one hour.

    Every error response has the same shape: `{ "error": "message" }`.

    Every route except `/docs` goes through a general rate limiter: 100 requests
    per IP every 15 minutes. `/auth/register` and `/auth/login` also have a
    stricter limiter (see each endpoint).

    A request body that is not valid JSON is rejected by the global error
    handler with `500 { "error": "Internal server error" }`.

servers:
  - url: http://localhost:3000
    description: Local

# Default security for the WHOLE API.
# Public endpoints override it with `security: []`.
# Same idea as in Postman: auth at collection level + "No Auth" where it does not apply.
security:
  - bearerAuth: []

tags:
  - name: General
  - name: Auth
  - name: Patients
  - name: Appointments
  - name: Email

paths:
  # ─────────────────────────────────────────────────────────────
  /:
    get:
      tags: [General]
      summary: Check that the API is up
      security: [] # public
      responses:
        "200":
          description: The API is alive
          content:
            text/plain:
              schema:
                type: string
                example: Welcome to Clinica API
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"

  # ───────────────────────────── AUTH ──────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: [] # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "409":
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Email is already registered
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error registering user

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a token
      security: [] # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: |
            Invalid credentials.

            The same 401 is returned whether the email does not exist or the
            password is wrong, so the API does not reveal which emails are
            registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid credentials
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error logging in

  # ─────────────────────────── PATIENTS ────────────────────────
  /patients:
    get:
      tags: [Patients]
      summary: List patients
      description: Returns only the patients owned by the authenticated user.
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Server error

    post:
      tags: [Patients]
      summary: Create a patient
      description: The new patient is owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientInput"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error creating patient

  /patients/{id}:
    # Path parameters declared here apply to all three methods.
    parameters:
      - $ref: "#/components/parameters/IdParam"

    get:
      tags: [Patients]
      summary: Get a patient by id
      responses:
        "200":
          description: Patient found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The patient belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: You do not have permission to view this patient
        "404":
          $ref: "#/components/responses/PatientNotFound"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error getting patient

    patch:
      tags: [Patients]
      summary: Partially update a patient
      description: |
        Partial update: only the fields sent are changed.
        Returns the updated patient. This response does not include `owner_id`.

        The body is validated before the id is checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientInput"
      responses:
        "200":
          description: Patient updated (without `owner_id`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: |
            Bad request. Three possible causes: the body has none of the
            fields, a field has the wrong type, or the id is not a number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                emptyBody:
                  summary: No field was sent
                  value:
                    error: Field is empty
                wrongType:
                  summary: A field has the wrong type
                  value:
                    error: Invalid data
                nonNumericId:
                  summary: The id is not a number
                  value:
                    error: Id must be a number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The patient belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: You do not have permission to update this patient
        "404":
          $ref: "#/components/responses/PatientNotFound"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error updating patient

    delete:
      tags: [Patients]
      summary: Delete a patient
      description: Also deletes the patient's appointments (ON DELETE CASCADE).
      responses:
        "204":
          description: Deleted. No response body.
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The patient belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: You do not have permission to delete this patient
        "404":
          $ref: "#/components/responses/PatientNotFound"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error deleting patient

  # ───────────────────────── APPOINTMENTS ──────────────────────
  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error getting appointments

    post:
      tags: [Appointments]
      summary: Create an appointment
      description: |
        The body is not validated by the API: a missing field or a
        `patient_id` that does not exist is rejected by the database and
        answered with a 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error creating appointment

  /appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"

    get:
      tags: [Appointments]
      summary: Get an appointment by id
      responses:
        "200":
          description: Appointment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error getting appointment

    patch:
      tags: [Appointments]
      summary: Partially update an appointment
      description: "Partial update: only the fields sent are changed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentInput"
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error updating appointment

    delete:
      tags: [Appointments]
      summary: Delete an appointment
      responses:
        "204":
          description: Deleted. No response body.
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AppointmentNotFound"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error deleting appointment

  # ───────────────────────────── EMAIL ─────────────────────────
  /emails:
    post:
      tags: [Email]
      summary: Send an email
      description: |
        Sends an email through Resend.

        Returns **202**, not 201: when Resend answers, the email is queued,
        not delivered. Delivery cannot be guaranteed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailInput"
      responses:
        "202":
          description: Email accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"
        "400":
          description: |
            Bad request. Three possible causes: a field is missing or is not
            a string, a field is empty, or the recipient has no `@`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongType:
                  summary: A field is missing or is not a string
                  value:
                    error: Invalid data
                emptyField:
                  summary: A field is empty or only whitespace
                  value:
                    error: Fields cannot be empty
                invalidRecipient:
                  summary: The recipient is not an email
                  value:
                    error: Recipient is not a valid email
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/GeneralTooManyRequests"
        "502":
          description: |
            The email provider rejected the message.

            502, not 500: the failure is in a service this API depends on,
            not in this API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Could not send email
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error sending email

# ═════════════════════════════════════════════════════════════════
# Reusable pieces. Defined once and referenced with $ref.
# ═════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtained from `POST /auth/login`. Expires after one hour.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Numeric identifier of the resource
      schema:
        type: integer
      example: 1

  # Error responses shared by several endpoints.
  responses:
    BadRequest:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid data

    InvalidId:
      description: The id is not a number
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Id must be a number

    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingToken:
              summary: "No `Authorization: Bearer <token>` header"
              value:
                error: Token not provided
            invalidToken:
              summary: The token is invalid or has expired
              value:
                error: Invalid or expired token

    PatientNotFound:
      description: The patient does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Patient not found

    AppointmentNotFound:
      description: The appointment does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Appointment not found

    TooManyRequests:
      description: |
        Too many failed attempts: 5 per IP in a 15-minute window. Only failed
        requests (status 400 or higher) count.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many attempts. Please try again in 15 minutes.

    GeneralTooManyRequests:
      description: "General rate limit reached: 100 requests per IP in a 15-minute window."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many requests. Please try again later.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid data

    # ── Patients ──
    Patient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Marta Sánchez
        age:
          type: integer
          example: 34
        diagnosis:
          type: string
          nullable: true
          example: Low back pain
        owner_id:
          type: integer
          nullable: true
          description: |
            Id of the user who owns the patient. Not included in the
            `PATCH /patients/{id}` response.
          example: 1

    CreatePatientInput:
      type: object
      required: [name, age] # diagnosis is optional
      properties:
        name:
          type: string
          example: Marta Sánchez
        age:
          type: integer
          example: 34
        diagnosis:
          type: string
          example: Low back pain

    UpdatePatientInput:
      type: object
      description: |
        All fields are optional, but at least one is required. Send only the
        fields that change.
      properties:
        name:
          type: string
        age:
          type: integer
        diagnosis:
          type: string
          example: Discharged

    # ── Appointments ──
    Appointment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: "2026-09-15T10:30:00Z"
        reason:
          type: string
          nullable: true
          example: Physiotherapy session

    CreateAppointmentInput:
      type: object
      required: [patient_id, date]
      properties:
        patient_id:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: "2026-09-15T10:30:00Z"
        reason:
          type: string
          example: Physiotherapy session

    UpdateAppointmentInput:
      type: object
      properties:
        date:
          type: string
          format: date-time
        reason:
          type: string

    # ── Auth ──
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: demo@example.com
        password:
          type: string
          format: password
          example: Example123
        name:
          type: string
          example: Demo User

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: demo@example.com
        password:
          type: string
          format: password
          example: Example123

    UserView:
      type: object
      description: Public view of a user. Never includes the password hash.
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: demo@example.com
        name:
          type: string
          example: Demo User

    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: JWT. Expires after one hour.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserView"

    # ── Email ──
    SendEmailInput:
      type: object
      required: [to, subject, text]
      properties:
        to:
          type: string
          format: email
          description: The API only checks that it contains an `@`.
          example: patient@example.com
        subject:
          type: string
          example: Appointment reminder
        text:
          type: string
          example: This is a reminder of your physiotherapy session on 15 September at 10:30.

    SendEmailResult:
      type: object
      properties:
        id:
          type: string
          description: Identifier returned by the email provider
          example: 4ef9bc1a-0f3e-4c2b-9d81-2f5a7c3e1b64
